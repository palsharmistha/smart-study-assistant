<!DOCTYPE html>
<html>
<head>
    <title>Smart Study Assistant</title>
</head>
<body>
<h1>Smart Study Assistant</h1>

<form id="noteForm">
    <input type="text" id="title" placeholder="Title"><br>
    <textarea id="content" placeholder="Paste your notes"></textarea><br>
    <button type="submit">Generate Summary & Quiz</button>
</form>

<div id="result"></div>

<script>
    const form = document.getElementById('noteForm');
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const response = await fetch('/api/study', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                title: document.getElementById('title').value,
                content: document.getElementById('content').value
            })
        });
        const data = await response.json();
        document.getElementById('result').innerText = `Summary: ${data.summary}\nQuiz: ${data.quiz}`;
    });
</script>
</body>
</html>
